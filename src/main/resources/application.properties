spring.application.name=scafolding
app.url=http://localhost:8080
app.dev-name=Tu Nombre
app.dev-email=tuemail@ejemplo.com
app.name=Nombre de la API
app.desc=Descripcion de la API
app.version=1.0.0

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:rodigymdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=rodygymH2testdb
spring.datasource.password=1234
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
